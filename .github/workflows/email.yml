name: Email Test
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Confingure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    - name: Send Email with SES
      run: |
          aws ses send-email \
          --from "mincoding@naver.com" \
          --destination "ToAddresses=uoahyns011@gmail.com" \
          --message "Subject={Data=테스트 메일 전송},Body={Text={Data=미니언즈가 좋아요요}}"
